name: CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint


  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck


  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test


  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build


  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # test:e2e launches "vite preview", so dist must exist first
      - name: Build application
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e


  ci_gate:
    name: CI Gate
    runs-on: ubuntu-latest

    if: ${{ always() }}

    needs:
      - lint
      - typecheck
      - unit_tests
      - build
      - e2e_tests

    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e_tests.result }}

        run: |
          echo "Lint:       $LINT_RESULT"
          echo "Typecheck:  $TYPECHECK_RESULT"
          echo "Unit tests: $UNIT_RESULT"
          echo "Build:      $BUILD_RESULT"
          echo "E2E tests:  $E2E_RESULT"

          if [[ "$LINT_RESULT" != "success" \
             || "$TYPECHECK_RESULT" != "success" \
             || "$UNIT_RESULT" != "success" \
             || "$BUILD_RESULT" != "success" \
             || "$E2E_RESULT" != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi

          echo "All required CI jobs passed."